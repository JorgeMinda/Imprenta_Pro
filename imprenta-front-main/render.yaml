services:
  - type: web
    name: imprenta-client
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://imprenta-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
