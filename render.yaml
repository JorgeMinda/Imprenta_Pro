services:
  # ── Backend API ────────────────────────────────────────────────────────────────
  - type: web
    name: imprenta-server
    runtime: node
    plan: free
    rootDir: imprenta-back-main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://imprenta-client.onrender.com

  # ── Frontend ───────────────────────────────────────────────────────────────────
  - type: web
    name: imprenta-client
    runtime: node
    plan: free
    rootDir: imprenta-front-main
    buildCommand: npm install && npm run build
    startCommand: node serve.cjs
    healthCheckPath: /
    envVars:
      - key: VITE_BACKEND_URL
        value: https://imprenta-server.onrender.com
      - key: PORT
        value: 3001
